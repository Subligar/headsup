name: Release

# A version tag is released once its commit is on main: a tag pushed before its pull request merges waits for it.
on:
  push:
    branches: [main]
    tags: ['v*']

# The merge and the tag can arrive together; one run at a time keeps them from releasing the same tag twice.
concurrency: release

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.unreleased.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: unreleased
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --merged origin/main --list 'v*' --sort=-version:refname); do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "releasing $tag"
              break
            fi
          done

  build:
    needs: find
    # Every push to main builds and tests, which keeps the caches warm; a tag push builds only to release.
    if: github.ref_type != 'tag' || needs.find.outputs.tag != ''
    runs-on: ubuntu-latest
    # Arch's MinGW and GCC match the toolchain HeadsUp is developed with; the build treats warnings as errors.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      HEADSUP_RMLUI_DIR: /github/home/.cache/headsup-rmlui
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Install the toolchain
        run: pacman -Syu --noconfirm --needed git gcc mingw-w64-gcc python cmake ninja curl patch ccache
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.find.outputs.tag || github.sha }}
      - name: Check the plugin's version matches the tag
        if: needs.find.outputs.tag != ''
        env:
          TAG: ${{ needs.find.outputs.tag }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "kVersion +=  *\"${version//./\\.}\";" src/plugin.cpp; then
            echo "src/plugin.cpp's kVersion is not $version, the version of tag $TAG" >&2
            exit 1
          fi
      - id: toolchain
        run: echo "versions=gcc$(gcc -dumpfullversion)-mingw$(i686-w64-mingw32-g++ -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - id: rmlui
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cache/headsup-rmlui/mingw
            /github/home/.cache/headsup-rmlui/linux
          key: rmlui-${{ hashFiles('tools/rmlui/**') }}-${{ steps.toolchain.outputs.versions }}
      - name: Build RmlUi and FreeType
        if: steps.rmlui.outputs.cache-hit != 'true'
        run: tools/rmlui/build.sh
      # A key is never overwritten, so each run saves its own and the next restores the newest.
      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ steps.toolchain.outputs.versions }}-${{ github.sha }}
          restore-keys: ccache-${{ steps.toolchain.outputs.versions }}-
      - name: Build and test
        # ccache stands in for both compilers by name, so build.sh needs no change.
        run: |
          mkdir -p /github/home/ccache-bin
          ln -sf /usr/bin/ccache /github/home/ccache-bin/g++
          ln -sf /usr/bin/ccache /github/home/ccache-bin/i686-w64-mingw32-g++
          PATH="/github/home/ccache-bin:$PATH" ./build.sh plugin
          ccache --show-stats
      - uses: actions/upload-artifact@v4
        if: needs.find.outputs.tag != ''
        with:
          name: headsup
          path: build/HeadsUp.dll
          if-no-files-found: error

  release:
    needs: [find, build]
    if: needs.find.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: headsup
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
        run: gh release create "$TAG" HeadsUp.dll --repo "$GITHUB_REPOSITORY" --verify-tag --title "HeadsUp $TAG" --generate-notes
